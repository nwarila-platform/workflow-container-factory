# Purpose: build an unaliased candidate, test it, bind evidence to its digest, verify it, then promote it.
# Role: isolated reusable builder for one validated factory container release.

name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  BUILDKIT_SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
  CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  SOURCE_DATE_EPOCH: "1704067200"

jobs:
  build:
    name: build candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      index-digest: ${{ steps.candidate.outputs.index-digest }}
      amd64-digest: ${{ steps.candidate.outputs.amd64-digest }}
      arm64-digest: ${{ steps.candidate.outputs.arm64-digest }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Validate release inputs
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#NAME} > 91 )); then
            printf 'invalid container name: %q\n' "$NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid container version: %q\n' "$VERSION" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$NAME/v$VERSION"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          token: ''
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx
        with:
          version: v0.35.0
          driver: docker-container
          driver-opts: image=docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          buildkitd-flags: --debug=false
          cache-binary: false
      - name: Log in to GHCR for candidate publication
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Install pinned Crane
        run: |
          set -euo pipefail
          bash tools/install-crane.sh
          printf '%s\n' "${PWD}/dist/tools" >> "$GITHUB_PATH"
      - name: Build and push unaliased candidate
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          mkdir -p dist/build
          docker buildx build \
            --builder "$BUILDER" \
            -f "containers/${NAME}/Containerfile" \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --label org.opencontainers.image.created=2024-01-01T00:00:00Z \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label org.opencontainers.image.source=https://github.com/nwarila-platform/workflow-container-factory \
            --label "org.opencontainers.image.version=${VERSION}" \
            --provenance=false \
            --attest "type=sbom,generator=${BUILDKIT_SBOM_GENERATOR}" \
            --metadata-file dist/build/image-metadata.json \
            --output type=registry,rewrite-timestamp=true,push-by-digest=true,name-canonical=true \
            --tag "$image" \
            "containers/${NAME}"
      - name: Validate candidate index and SPDX SBOMs
        id: candidate
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          index_digest="$(jq -er '."containerimage.digest"' dist/build/image-metadata.json)"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          result="$(python3.12 tools/check-index.py "$image" "$index_digest")"
          printf '%s\n' "$result"
          amd64_digest="$(awk '$1 == "child" && $2 == "ok:" && $3 == "linux/amd64" { print $4 }' <<<"$result")"
          arm64_digest="$(awk '$1 == "child" && $2 == "ok:" && $3 == "linux/arm64" { print $4 }' <<<"$result")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(grep -c '^child ok:' <<<"$result")" -eq 2
          {
            printf 'index-digest=%s\n' "$index_digest"
            printf 'amd64-digest=%s\n' "$amd64_digest"
            printf 'arm64-digest=%s\n' "$arm64_digest"
          } >> "$GITHUB_OUTPUT"
      - name: Validate requirement labels
        env:
          AMD64_DIGEST: ${{ steps.candidate.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.candidate.outputs.arm64-digest }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          for child in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            crane config "${image}@${child}" | jq .config > "$work/config.json"
            bash tools/check-labels.sh "$work/config.json"
          done

  test:
    name: test candidate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Validate release inputs
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#NAME} > 91 )); then
            printf 'invalid container name: %q\n' "$NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid container version: %q\n' "$VERSION" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$NAME/v$VERSION"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Run image tests on both children
        env:
          AMD64_DIGEST: ${{ needs.build.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ needs.build.outputs.arm64-digest }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash "containers/${NAME}/tests/image.sh" "${image}@${AMD64_DIGEST}" linux/amd64
          bash "containers/${NAME}/tests/image.sh" "${image}@${ARM64_DIGEST}" linux/arm64

  sign:
    name: sign and attest
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Validate release inputs
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#NAME} > 91 )); then
            printf 'invalid container name: %q\n' "$NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid container version: %q\n' "$VERSION" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$NAME/v$VERSION"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Log in to GHCR for recursive signing
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Sign immutable index and children
        env:
          INDEX_DIGEST: ${{ needs.build.outputs.index-digest }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes --recursive "ghcr.io/nwarila-platform/workflow-${NAME}@${INDEX_DIGEST}"
      - name: Attest GitHub build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/nwarila-platform/workflow-${{ inputs.name }}
          subject-digest: ${{ needs.build.outputs.index-digest }}
          push-to-registry: true

  verify:
    name: verify candidate
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Validate release inputs
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#NAME} > 91 )); then
            printf 'invalid container name: %q\n' "$NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid container version: %q\n' "$VERSION" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$NAME/v$VERSION"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          token: ''
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Install pinned Crane
        run: |
          set -euo pipefail
          bash tools/install-crane.sh
          printf '%s\n' "${PWD}/dist/tools" >> "$GITHUB_PATH"
      - name: Create fresh empty Docker configuration
        run: |
          set -euo pipefail
          anonymous_config="${RUNNER_TEMP}/anonymous-docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$anonymous_config"
          install -d -m 0700 "$anonymous_config"
          test -z "$(find "$anonymous_config" -mindepth 1 -maxdepth 1 -print -quit)"
          printf 'DOCKER_CONFIG=%s\n' "$anonymous_config" >> "$GITHUB_ENV"
      - name: Verify exact keyless signatures
        env:
          AMD64_DIGEST: ${{ needs.build.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ needs.build.outputs.arm64-digest }}
          INDEX_DIGEST: ${{ needs.build.outputs.index-digest }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test ! -e "$DOCKER_CONFIG/config.json"
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          identity="https://github.com/nwarila-platform/workflow-container-factory/.github/workflows/build.yaml@refs/tags/${NAME}/v${VERSION}"
          for digest in "$INDEX_DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign verify "${image}@${digest}" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              --certificate-github-workflow-repository nwarila-platform/workflow-container-factory \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-ref "refs/tags/${NAME}/v${VERSION}"
          done
          test ! -e "$DOCKER_CONFIG/config.json"
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ needs.build.outputs.index-digest }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test ! -e "$DOCKER_CONFIG/config.json"
          gh attestation verify "oci://ghcr.io/nwarila-platform/workflow-${NAME}@${INDEX_DIGEST}" \
            --repo nwarila-platform/workflow-container-factory \
            --signer-workflow nwarila-platform/workflow-container-factory/.github/workflows/build.yaml \
            --source-ref "refs/tags/${NAME}/v${VERSION}"
          test ! -e "$DOCKER_CONFIG/config.json"
      - name: Verify public index and SPDX SBOMs anonymously
        env:
          INDEX_DIGEST: ${{ needs.build.outputs.index-digest }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          test ! -e "$DOCKER_CONFIG/config.json"
          python3.12 tools/check-index.py \
            "ghcr.io/nwarila-platform/workflow-${NAME}" \
            "$INDEX_DIGEST"
          test ! -e "$DOCKER_CONFIG/config.json"
  promote:
    name: promote
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Validate release inputs
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#NAME} > 91 )); then
            printf 'invalid container name: %q\n' "$NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid container version: %q\n' "$VERSION" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$NAME/v$VERSION"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Crane
        run: |
          set -euo pipefail
          bash tools/install-crane.sh
          printf '%s\n' "${PWD}/dist/tools" >> "$GITHUB_PATH"
      - name: Log in to GHCR for promotion
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Apply exactly two create-once tags and read them back
        env:
          INDEX_DIGEST: ${{ needs.build.outputs.index-digest }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/nwarila-platform/workflow-${NAME}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git cat-file -t "$GITHUB_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(crane digest "${image}@${INDEX_DIGEST}")" = "$INDEX_DIGEST"

          aliases=("$VERSION" "sha-$GITHUB_SHA")
          check_alias() {
            local alias="$1"
            local error_file="dist/crane-${alias}.stderr"
            local observed
            if observed="$(crane digest "${image}:${alias}" 2> "$error_file")"; then
              if [[ "$observed" != "$INDEX_DIGEST" ]]; then
                printf 'create-once violation: %s:%s is %s, candidate is %s\n' \
                  "$image" "$alias" "$observed" "$INDEX_DIGEST" >&2
                exit 1
              fi
              printf 'existing alias already equals candidate: %s:%s=%s\n' "$image" "$alias" "$observed"
            elif grep -Eiq 'MANIFEST_UNKNOWN|NAME_UNKNOWN|manifest unknown|not found|404' "$error_file"; then
              printf 'alias is absent and eligible for creation: %s:%s\n' "$image" "$alias"
            else
              cat "$error_file" >&2
              printf 'could not classify alias lookup failure for %s:%s\n' "$image" "$alias" >&2
              exit 1
            fi
          }

          mkdir -p dist
          for alias in "${aliases[@]}"; do
            check_alias "$alias"
          done
          for alias in "${aliases[@]}"; do
            crane tag "${image}@${INDEX_DIGEST}" "$alias"
          done
          for alias in "${aliases[@]}"; do
            observed="$(crane digest "${image}:${alias}")"
            if [[ "$observed" != "$INDEX_DIGEST" ]]; then
              printf 'post-promotion digest mismatch: %s:%s=%s expected=%s\n' \
                "$image" "$alias" "$observed" "$INDEX_DIGEST" >&2
              exit 1
            fi
          done
          printf 'promoted %s:%s = %s\n' "$image" "$VERSION" "$INDEX_DIGEST"
